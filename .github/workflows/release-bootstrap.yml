name: Release bootstrap

on:
  push:
    branches: [portfolio-improvements-2026-08]
    paths:
      - .github/workflows/release-bootstrap.yml

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: portfolio-improvements-2026-08
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate deterministic lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Clean install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Tests
        run: npm test
      - name: TypeScript
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Commit verified lockfile
        run: |
          git config user.name 'Egor Denisov'
          git config user.email 'designer.egor@ya.ru'
          git add package-lock.json
          if git diff --cached --quiet; then
            echo 'No lockfile changes to commit'
            exit 0
          fi
          git commit -m 'build: add verified web3 lockfile'
          git push origin HEAD:portfolio-improvements-2026-08
